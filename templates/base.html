<!doctype html>
<html lang="{{ language }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Grocy Receipt Importer</title>

<script>
(function () {
    const theme = localStorage.getItem("theme");
    if (theme === "dark") {
        document.documentElement.dataset.theme = "dark";
    }
})();
</script>

<style>
:root {
    color-scheme: light;

    --background: #f5f5f5;
    --surface: #fff;
    --text: #222;
    --muted: #666;
    --border: #ddd;
    --shadow: #0001;
    --input-background: #fff;
    --button-background: #eee;
    --error: #a00;
    --warning: #996000;
    --success: #176b2c;
}

:root[data-theme="dark"] {
    color-scheme: dark;

    --background: #181818;
    --surface: #242424;
    --text: #eee;
    --muted: #aaa;
    --border: #444;
    --shadow: #0006;
    --input-background: #303030;
    --button-background: #383838;
    --error: #ff7b7b;
    --warning: #ffc857;
    --success: #6edb8a;
}

body {
    font-family: system-ui, sans-serif;
    max-width: 1200px;
    margin: 2rem auto;
    padding: 0 1rem;
    background: var(--background);
    color: var(--text);
    transition: background .2s, color .2s;
}

.card {
    background: var(--surface);
    padding: 1.25rem;
    border-radius: 12px;
    margin-bottom: 1rem;
    box-shadow: 0 1px 5px var(--shadow);
}

table {
    width: 100%;
    border-collapse: collapse;
}

th,
td {
    padding: .55rem;
    border-bottom: 1px solid var(--border);
    text-align: left;
    vertical-align: top;
}

.money {
    text-align: right;
    white-space: nowrap;
}

button,
input,
select {
    font: inherit;
    padding: .45rem;
    background: var(--input-background);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
}

button {
    background: var(--button-background);
    cursor: pointer;
}

button:hover {
    filter: brightness(1.1);
}

.secondary-button {
    display: inline-block;
    margin-left: .5rem;
    padding: .45rem .7rem;
    background: var(--button-background);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    text-decoration: none;
}

.secondary-button:hover {
    filter: brightness(1.1);
}


.receipt-actions {
    display: flex;
    align-items: center;
    gap: .5rem;
    flex-wrap: wrap;
}

.receipt-actions form {
    margin: 0;
}

.receipt-actions .secondary-button,
.receipt-actions .primary-button {
    margin: 0;
}


.small {
    color: var(--muted);
    font-size: .9rem;
}

.error {
    color: var(--error);
}

.receipt-header {
    border-top: 6px solid var(--parser-accent, var(--border));
}

.parser-badge {
    display: inline-block;
    padding: .35rem .65rem;
    margin: .25rem 0 1rem;
    border-radius: 999px;
    background: var(--button-background);
    color: var(--parser-accent, var(--text));
}

.primary-button {
    background: var(--parser-accent, var(--button-background));
    color: var(--parser-accent-text, var(--text));
    border-color: var(--parser-accent, var(--border));
    font-weight: 600;
}

.item-status {
    font-weight: 600;
    white-space: nowrap;
}

.product-selection {
    display: flex;
    align-items: center;
    gap: .5rem;
}

.mapping-indicator {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 1.4rem;
    height: 1.4rem;
    border-radius: 50%;
    font-weight: 700;
    flex-shrink: 0;
}

.mapping-saved {
    color: var(--success);
    background: color-mix(
        in srgb,
        var(--success) 15%,
        transparent
    );
}

.mapping-suggested {
    color: #2980d9;
    background: color-mix(
        in srgb,
        #2980d9 15%,
        transparent
    );
}

.mapping-none {
    color: var(--warning);
    background: color-mix(
        in srgb,
        var(--warning) 15%,
        transparent
    );
}

.status-imported {
    color: var(--success);
}

.status-skipped {
    color: var(--muted);
}

.status-failed {
    color: var(--error);
}

.import-summary {
    margin-top: 1rem;
    padding: .75rem;
    border-left: 4px solid var(--parser-accent, var(--border));
    background: var(--button-background);
    color: var(--text);
}

.warning {
    color: var(--warning);
}

.success {
    color: var(--success);
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 1rem;
    margin-bottom: 1rem;
}

.header h1 {
    margin: 0;
}

.theme-toggle {
    padding: .4rem .65rem;
    font-size: 1.1rem;
}

.header-controls {
    display: flex;
    align-items: center;
    gap: .5rem;
}

.language-form {
    margin: 0;
}

.language-form select {
    appearance: none;
    -webkit-appearance: none;
    -moz-appearance: none;
    padding: .4rem .65rem;
    font-size: .9rem;
    font-weight: 600;
    min-width: 3rem;
    text-align: center;
    cursor: pointer;
}

.receipt-actions {
    display: flex;
    align-items: center;
    gap: .5rem;
}

.receipt-actions .back-button {
    margin-left: auto;
}

.primary-button:disabled {
    opacity: .5;
    cursor: not-allowed;
}

input[type="checkbox"]:disabled {
    cursor: not-allowed;
    opacity: .5;
}

.delete-button {
    padding: .4rem .65rem;
    border: 1px solid var(--error);
    border-radius: 4px;
    background: transparent;
    color: var(--error);
    cursor: pointer;
}

.delete-button:hover {
    background: var(--error);
    color: var(--surface);
}

.unlink-button {
    margin-left: .5rem;
    width: 2rem;
    height: 2rem;
    padding: 0;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: var(--button-background);
    color: var(--text);
    cursor: pointer;
    font-size: 1rem;
    line-height: 1;
}

.unlink-button:hover {
    filter: brightness(1.1);
}

.undo-button {
    margin-left: .5rem;
    width: 2rem;
    height: 2rem;
    padding: 0;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: var(--button-background);
    color: var(--text);
    cursor: pointer;
    font-size: 1.2rem;
    line-height: 1;
}

.undo-button:hover {
    filter: brightness(1.1);
}

.header-controls {
    display: flex;
    align-items: center;
    gap: .5rem;
}

.language-form {
    margin: 0;
}

.language-form select {
    appearance: none;
    -webkit-appearance: none;
    -moz-appearance: none;
    padding: .4rem .65rem;
    font-size: .9rem;
    font-weight: 600;
    min-width: 3rem;
    text-align: center;
    cursor: pointer;
}
</style>
</head>

<body>

<div class="header">
    <h1>Grocy Receipt Importer</h1>

    <div class="header-controls">
        <form action="/language" method="post" class="language-form">
            <select
                name="language"
                id="language-select"
                aria-label="{{ t("ui.language") }}"
                onchange="this.form.submit()"
            >
                {% for lang in available_languages %}
                <option
                    value="{{ lang }}"
                    {% if lang == language %}selected{% endif %}
                >
                    {{ lang|upper }}
                </option>
                {% endfor %}
            </select>
        </form>

        <button
            type="button"
            class="theme-toggle"
            id="theme-toggle"
            aria-label="{{ t("ui.toggle_dark_mode") }}"
            title="{{ t("ui.toggle_dark_mode") }}"
        >🌙</button>
    </div>
</div>

{% block content %}{% endblock %}

<script>
(function () {
    const root = document.documentElement;
    const button = document.getElementById("theme-toggle");

    function updateButton() {
        const dark = root.dataset.theme === "dark";
        button.textContent = dark ? "☀️" : "🌙";
        button.setAttribute(
            "aria-label",
            dark ? "Switch to light mode" : "Switch to dark mode"
        );
        button.setAttribute(
            "title",
            dark ? "Switch to light mode" : "Switch to dark mode"
        );
    }

    button.addEventListener("click", function () {
        const dark = root.dataset.theme === "dark";

        if (dark) {
            delete root.dataset.theme;
            localStorage.setItem("theme", "light");
        } else {
            root.dataset.theme = "dark";
            localStorage.setItem("theme", "dark");
        }

        updateButton();
    });

    updateButton();
})();
</script>

</body>
</html>

<style>
.receipt-actions-header {
    width: 1%;
    white-space: nowrap;
}

.receipt-row-actions {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: .35rem;
    white-space: nowrap;
}

.receipt-icon-button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 2rem;
    height: 2rem;
    padding: 0;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: transparent;
    color: inherit;
    text-decoration: none;
    cursor: pointer;
    font-size: 1rem;
    line-height: 1;
}

.receipt-icon-button:hover {
    background: var(--surface-alt);
}

.delete-icon-button {
    border-color: var(--error);
    color: var(--error);
}

.delete-icon-button:hover {
    background: var(--error);
    color: var(--surface);
}
</style>

<style>
.new-product-fields {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 0.65rem;
    align-items: end;
    width: 100%;
    max-width: 100%;
    box-sizing: border-box;
    margin-top: 0.75rem;
    padding: 0.65rem;
    border: 1px solid #ccc;
    border-radius: 0.4rem;
    overflow: hidden;
}

.new-product-field {
    min-width: 0;
}

.new-product-field label {
    display: block;
    margin-bottom: 0.3rem;
    font-weight: 600;
}

.new-product-field input,
.new-product-field select {
    min-width: 0;
    max-width: 100%;
    width: 100%;
    box-sizing: border-box;
}

.new-product-conversion {
    display: flex;
    align-items: center;
    gap: 0.35rem;
    min-width: 0;
    flex-wrap: wrap;
}

.new-product-conversion label {
    width: 100%;
    margin-right: 0;
}

.new-product-conversion input {
    width: 70px;
    flex: 0 1 70px;
}

.new-product-create-button {
    width: 100%;
    min-width: 0;
    box-sizing: border-box;
}

.new-product-status {
    grid-column: 1 / -1;
    padding: 0.5rem 0.65rem;
    border-radius: 0.3rem;
    font-weight: 600;
}

.new-product-status-missing {
    background: #fff3cd;
    border: 1px solid #ffe69c;
}

.new-product-status-failed {
    background: #f8d7da;
    border: 1px solid #f1aeb5;
}

.new-product-status-success {
    background: #d1e7dd;
    border: 1px solid #a3cfbb;
}

.new-product-create-button.status-missing {
    background: #ffc107;
    color: #000;
}

.new-product-create-button.status-failed {
    background: #dc3545;
    color: #fff;
}

.new-product-create-button.status-success {
    background: #198754;
    color: #fff;
}

@media (max-width: 700px) {
    .new-product-fields {
        grid-template-columns: minmax(0, 1fr);
    }

    .new-product-conversion,
    .new-product-create-button,
    .new-product-status {
        grid-column: 1;
    }
}
</style>
